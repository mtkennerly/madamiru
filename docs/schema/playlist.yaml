---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Playlist
description: Settings for a playlist
type: object
properties:
  layout:
    $ref: "#/$defs/Layout"
    default:
      group:
        content_fit: scale
        max_media: 1
        orientation: horizontal
        orientation_limit: automatic
        sources: []
$defs:
  ContentFit:
    oneOf:
      - description: "Scale the media up or down to fill as much of the available space as possible\nwhile maintaining the media's aspect ratio."
        type: string
        const: scale
      - description: "Scale the media down to fill as much of the available space as possible\nwhile maintaining the media's aspect ratio.\nDon't scale up if it's smaller than the available space."
        type: string
        const: scale_down
      - description: "Crop the media to fill all of the available space.\nMaintain the aspect ratio, cutting off parts of the media as needed to fit."
        type: string
        const: crop
      - description: "Stretch the media to fill all of the available space.\nPreserve the whole media, disregarding the aspect ratio."
        type: string
        const: stretch
  FilePath:
    type: string
  Group:
    type: object
    properties:
      content_fit:
        $ref: "#/$defs/ContentFit"
        default: scale
      max_media:
        type: integer
        format: uint
        default: 1
        minimum: 0
      orientation:
        $ref: "#/$defs/Orientation"
        default: horizontal
      orientation_limit:
        $ref: "#/$defs/OrientationLimit"
        default: automatic
      sources:
        type: array
        default: []
        items:
          $ref: "#/$defs/Source"
  Layout:
    oneOf:
      - type: object
        properties:
          split:
            $ref: "#/$defs/Split"
        additionalProperties: false
        required:
          - split
      - type: object
        properties:
          group:
            $ref: "#/$defs/Group"
        additionalProperties: false
        required:
          - group
  Orientation:
    type: string
    enum:
      - horizontal
      - vertical
  OrientationLimit:
    oneOf:
      - type: string
        enum:
          - automatic
      - type: object
        properties:
          fixed:
            type: integer
            format: uint
            minimum: 1
        additionalProperties: false
        required:
          - fixed
  Source:
    oneOf:
      - type: object
        properties:
          path:
            type: object
            properties:
              path:
                $ref: "#/$defs/FilePath"
            required:
              - path
        additionalProperties: false
        required:
          - path
      - type: object
        properties:
          glob:
            type: object
            properties:
              pattern:
                type: string
            required:
              - pattern
        additionalProperties: false
        required:
          - glob
  Split:
    type: object
    properties:
      axis:
        $ref: "#/$defs/SplitAxis"
        default: horizontal
      first:
        $ref: "#/$defs/Layout"
        default:
          group:
            content_fit: scale
            max_media: 1
            orientation: horizontal
            orientation_limit: automatic
            sources: []
      ratio:
        type: number
        format: float
        default: 0.5
      second:
        $ref: "#/$defs/Layout"
        default:
          group:
            content_fit: scale
            max_media: 1
            orientation: horizontal
            orientation_limit: automatic
            sources: []
  SplitAxis:
    type: string
    enum:
      - horizontal
      - vertical
