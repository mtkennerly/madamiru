---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Config
description: "Settings for `config.yaml`"
type: object
properties:
  playback:
    $ref: "#/$defs/Playback"
    default:
      image_duration: 10
      muted: false
      pause_on_unfocus: false
      synchronized: false
      volume: 1.0
  release:
    $ref: "#/$defs/Release"
    default:
      check: true
  view:
    $ref: "#/$defs/View"
    default:
      confirm_discard_playlist: true
      grid_padding: 5
      group_padding: 5
      language: en-US
      media_padding: 5
      show_fullscreen_controls: false
      show_media_borders: true
      theme: dark
$defs:
  Language:
    description: Display language.
    oneOf:
      - description: English
        type: string
        const: en-US
      - description: French
        type: string
        const: fr-FR
      - description: German
        type: string
        const: de-DE
      - description: Polish
        type: string
        const: pl-PL
      - description: Brazilian Portuguese
        type: string
        const: pt-BR
  Playback:
    type: object
    properties:
      image_duration:
        description: "How long to show images, in seconds."
        type: integer
        format: uint
        default: 10
        minimum: 1
      muted:
        description: Whether all players are muted.
        type: boolean
        default: false
      pause_on_unfocus:
        description: Whether to pause when window loses focus.
        type: boolean
        default: false
      synchronized:
        description: Whether to synchronize play/pause/seek events in media of the same category.
        type: boolean
        default: false
      volume:
        description: "Volume level when not muted. 1.0 is 100%, 0.01 is 1%."
        type: number
        format: float
        default: 1.0
  Release:
    type: object
    properties:
      check:
        description: "Whether to check for new releases.\nIf enabled, the application will check at most once every 24 hours."
        type: boolean
        default: true
  Theme:
    description: Visual theme.
    type: string
    enum:
      - light
      - dark
  View:
    type: object
    properties:
      confirm_discard_playlist:
        type: boolean
        default: true
      grid_padding:
        type: integer
        format: uint8
        default: 5
        maximum: 255
        minimum: 0
      group_padding:
        type: integer
        format: uint8
        default: 5
        maximum: 255
        minimum: 0
      language:
        $ref: "#/$defs/Language"
        default: en-US
      media_padding:
        type: integer
        format: uint8
        default: 5
        maximum: 255
        minimum: 0
      show_fullscreen_controls:
        type: boolean
        default: false
      show_media_borders:
        type: boolean
        default: true
      theme:
        $ref: "#/$defs/Theme"
        default: dark
