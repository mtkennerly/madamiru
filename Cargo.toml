[package]
name = "madamiru"
version = "0.5.0"
authors = ["mtkennerly <mtkennerly@gmail.com>"]
edition = "2024"
description = "Dynamic multi-multimedia player"
repository = "https://github.com/mtkennerly/madamiru"
readme = "README.md"
license = "MIT"

[features]
default = ["audio", "video"]
audio = ["dep:rodio", "dep:symphonia", "dep:symphonia-adapter-libopus"]
video = ["dep:gstreamer", "dep:gstreamer-app", "dep:iced_video_player"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
dirs = "7.0.0"
flexi_logger = { version = "0.31.10", features = ["textfilter"], default-features = false }
fluent = "0.17.0"
globetter = "0.2.0"
gstreamer = { version = "0.23.7", optional = true }
gstreamer-app = { version = "0.23.5", optional = true }
iced = { version = "0.14.0", features = ["advanced", "advanced-shaping", "crisp", "image", "lazy", "svg", "tiny-skia", "tokio", "wayland", "wgpu", "x11"], default-features = false }
iced_moving_picture = "0.2.0"
iced_video_player = { version = "0.6.0", optional = true }
image = { version = "0.25.10", features = ["ico"], default-features = false }
infer = "0.22.0"
intl-memoizer = "0.5.3"
itertools = "0.15.0"
log = "0.4.35"
mime_guess = "2.0.5"
png = "0.18.1"
opener = "0.9.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "gzip", "rustls"], default-features = false }
rfd = { version = "0.18.0", features = ["gtk3"], default-features = false }
rodio = { version = "0.23.0", features = ["playback", "symphonia-all"], default-features = false, optional = true }
schemars = { version = "1.2.3", features = ["chrono04"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.8.26"
symphonia = { version = "0.5.5", default-features = false, features = ["all"], optional = true }
symphonia-adapter-libopus = { version = "0.2.9", optional = true }
tokio = { version = "1.54.1", features = ["macros", "time"] }
tree_magic_mini = "3.2.2"
typed-path = "0.13.0"
unic-langid = "0.9.6"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[target.'cfg(target_os = "macos")'.build-dependencies]
system-deps = "9.0.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
test-case = "3.4.1"
velcro = "0.5.4"

[lints]
cargo.unused_dependencies = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-win64{ archive-suffix }"

[package.metadata.binstall.overrides.i686-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-win32{ archive-suffix }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-mac{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.system-deps]
"gstreamer-1.0" = "1.14"
